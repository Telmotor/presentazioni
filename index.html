<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Presentazioni Telmotor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap">
<style>
:root{--blue:#1D62AD;--ink:#1D1D1B;--mute:#5B6573;--line:#D3DBE6;--bg:#F4F7FB}
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left,0px)) 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:40px}
header img{width:190px;height:auto}
h1{margin:0;font-size:clamp(28px,4vw,40px);font-weight:600}
.k{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#0080A6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{display:block;background:#fff;border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,40,80,.12)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.card div{padding:18px 20px 20px;border-top:3px solid var(--blue)}
.card h2{margin:0 0 6px;font-size:22px;font-weight:600}
.card p{margin:0;color:var(--mute);font-size:15px;line-height:1.45}
</style>
<script>
// vecchi link tipo presentazioni.telmotor.it/#s30 -> company profile
if (/^#s\d+$/.test(location.hash)) location.replace('/company-profile/' + location.hash);
</script>
<div class="wrap">
  <header>
    <div><p class="k">Telmotor</p><h1>Presentazioni</h1></div>
    <img src="/assets/logo.png" alt="Telmotor, innovation inside">
  </header>
  <main class="grid">
    <a class="card" href="/company-profile/">
      <img src="/assets/cover-company-profile.jpg" alt="">
      <div><h2>Company profile</h2><p>Chi siamo, aree di business, Academy, Diginnova e oltre 250 case history filtrabili per regione.</p></div>
    </a>
  </main>
</div>
